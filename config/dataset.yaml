# 数据集配置（docs/02-数据集方案.md）
# active_source 切换数据源：M1 流程验证用 coco_val2017；M2 手部模型切 assembly101
# （assembly101 为 gated 数据集，需 export HF_TOKEN=<在 HF 网站点击授权后的读 token>）

active_source: assembly101

max_download_gb: 5
train_ratio: 0.8
seed: 42
converted_dir: datasets/converted/sop_pose

# 路线D：手部模型预标注参数（docs/02 §1/§3）
prelabel:
  fps_extract: 10
  margin: 0.25
  neg_ratio: 0.10
  min_labeled_frames: 3000

sources:
  coco_val2017:
    kind: coco_keypoints
    num_keypoints: 17
    min_kpts_per_person: 6      # 过滤严重遮挡的人
    background_ratio: 0.10      # 额外保留的负样本图比例
    download:
      # 国内源（ModelScope PAI/COCO2017 镜像）；images.cocodataset.org 国际源单流仅 ~0.36MB/s，弃用
      - url: https://modelscope.cn/api/v1/datasets/PAI/COCO2017/repo?Revision=master&FilePath=val2017.zip
        dest: datasets/raw/coco/val2017.zip
      - url: https://modelscope.cn/api/v1/datasets/PAI/COCO2017/repo?Revision=master&FilePath=annotations_trainval2017.zip
        dest: datasets/raw/coco/annotations_trainval2017.zip
    keypoint_json: datasets/raw/coco/annotations/person_keypoints_val2017.json
    images_root: datasets/raw/coco/val2017

  assembly101:
    kind: assembly101_poses
    api: https://huggingface.co/api/datasets/cvml-nus/assembly101/tree/main
    resolve: https://huggingface.co/datasets/cvml-nus/assembly101/resolve/main
    token_env: HF_TOKEN
    with_poses: false            # 路线D：教师模型自产 2D 标签，官方 3D 姿态 JSON 不再下载
    takes:
      - nusar-2021_action_both_9031-c10b_9031_user_id_2021-02-04_101221   # 0.18GB（已下）
      - nusar-2021_action_both_9084-b04c_9084_user_id_2021-02-25_143221   # 0.19GB（已下）
      - nusar-2021_action_both_9036-c01c_9036_user_id_2021-02-18_092311   # 0.19GB
      - nusar-2021_action_both_9023-c04b_9023_user_id_2021-02-23_144136   # 0.28GB
      - nusar-2021_action_both_9046-b06b_9046_user_id_2021-02-22_105953   # 0.41GB
      - nusar-2021_action_both_9085-c01d_9085_user_id_2021-02-22_172144   # 0.42GB
      - nusar-2021_action_both_9084-b02b_9084_user_id_2021-02-25_141202   # 0.43GB
      - nusar-2021_action_both_9031-b01b_9031_user_id_2021-02-23_160708   # 0.46GB
    views: [v1]                  # v1 = C10095_rgb.mp4（第三人称固定视角）
    view_map:
      v1: C10095_rgb.mp4
      v2: C10115_rgb.mp4
      v3: C10118_rgb.mp4
      v4: C10119_rgb.mp4
      v5: C10379_rgb.mp4
      v6: C10390_rgb.mp4
      v7: C10395_rgb.mp4
      v8: C10404_rgb.mp4
    fps_extract: 5
    num_keypoints: 42            # 右手 21 + 左手 21
